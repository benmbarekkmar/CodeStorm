# Render blueprint — HackFlow (CodeStorm)
#
# Create the project from this file: Render dashboard → New → Blueprint → point it at
# the repository. Everything except GEMINI_API_KEY is filled in by Render itself.
#
# Before the first deploy, from a terminal with access to the local database:
#   pg_dump -U hackflow hackflow > hackflow_release.dump
#   pg_restore -d "$DATABASE_URL" --no-owner hackflow_release.dump
# and copy the 60-odd uploaded files (media/) onto the disk with the Render file API
# or a one-off `manage.py` command — they are gitignored, so the build never sees them.

databases:
  - name: hackflow-db
    databaseName: hackflow
    user: hackflow
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    # The password is generated by Render and never written in this file.

services:
  - type: web
    name: hackflow
    region: frankfurt
    # A disk needs a paid instance. Drop `disk:` to run on the free tier, but then
    # every uploaded banner and pitch deck disappears at the next deploy.
    plan: starter
    runtime: python
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz/
    buildCommand: >-
      uv sync --frozen
      && uv run python manage.py collectstatic --noinput
      && uv run python manage.py migrate --noinput
    # One worker: the instance is small, and an analysis holds its worker for the
    # whole Gemini call. --timeout has to stay above GEMINI_TIMEOUT below.
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    disk:
      name: hackflow-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hackflow-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS are read from
      # RENDER_EXTERNAL_HOSTNAME by config/settings.py; list a custom domain here
      # as a comma-separated value if you attach one.
      - key: ALLOWED_HOSTS
        value: ""
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_TIMEOUT
        value: "120"
      # Fill this in once in the Render dashboard; it is never stored in git.
      - key: GEMINI_API_KEY
        sync: false
