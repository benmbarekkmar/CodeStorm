{% extends "base.html" %}
{% load i18n %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="px-space-lg py-space-xl text-center">
  <h1 class="font-headline-lg">{% trans "Page not found" %}</h1>
  <p class="my-4 text-on-surface-variant">{% trans "The page you are looking for does not exist." %}</p>
  <a href="{% url 'dashboard' %}" class="px-5 py-2 rounded-lg bg-primary text-on-primary">{% trans "Back to dashboard" %}</a>
</div>
{% endblock %}
