{% if messages %}
<div class="flex flex-col gap-2" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="px-4 py-3 rounded-lg {% if message.tags == 'error' %}bg-error-container text-on-error-container{% else %}bg-primary-fixed text-on-primary-fixed-variant{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
