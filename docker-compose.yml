services:
  db:
    image: postgres:16-alpine
    container_name: hackflow_db
    environment:
      POSTGRES_DB: hackflow
      POSTGRES_USER: hackflow
      POSTGRES_PASSWORD: hackflow
    ports:
      - "5432:5432"
    volumes:
      - hackflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackflow -d hackflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hackflow_pgdata:
